<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":926}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    var picked = ['Chicago', 'Boston', 'Philadelphia', 'New Orleans', 'Washington DC', 'Baltimore', 'Providence'];
    this.state = { y: 'pass_signups', loc: 'market_name', date: 'sale_date', cov: null, shown: true, stale: false, picked: picked, draft: picked, pickerOpen: true, dmaQuery: '' };
  }

  line(seed, base, n) {
    var s = seed;
    var rnd = function () { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    var daily = [];
    for (var i = 0; i < n; i++) {
      var dow = i % 7;
      var weekly = (dow === 5 || dow === 6) ? -0.13 : (dow === 0 ? 0.04 : 0.02);
      var trend = 0.06 * Math.sin(i / 22 + seed) + (i > 50 && i < 80 ? 0.12 : 0);
      daily.push(base * (1 + weekly + trend + (rnd() - 0.5) * 0.12));
    }
    var pts = [];
    for (var j = 6; j < n; j++) {
      var sum = 0;
      for (var k = j - 6; k <= j; k++) sum += daily[k];
      var x = 64 + j * (1120 / (n - 1));
      var y = 430 - (sum / 7) / 4000 * 410;
      pts.push((pts.length ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1));
    }
    return pts.join(' ');
  }

  renderVals() {
    var self = this;
    var st = this.state;
    var base = 'width: 100%; height: 36px; box-sizing: border-box; padding: 0 32px 0 12px; background: #ffffff; border: 1px solid #E4E8ED; border-radius: 6px; font-size: 13px; cursor: pointer; color: ';
    var fields = {};
    ['y', 'loc', 'date', 'cov'].forEach(function (k) {
      var v = st[k] || '';
      fields[k + 'Val'] = v;
      fields[k + 'Style'] = base + (v ? '#242526' : '#686A6C');
      fields[k + 'Change'] = function (e) { var o = { stale: true }; o[k] = e.target.value; self.setState(o); };
    });
    var ready = !!(st.y && st.loc && st.date);
    // The graph already reflects the chosen columns until one of them changes.
    var canGenerate = ready && (st.stale || !st.shown);
    var n = 365;
    var catalog = [
      { name: 'Chicago', base: 2700, seed: 11 },
      { name: 'Boston', base: 2000, seed: 17 },
      { name: 'Philadelphia', base: 1600, seed: 23 },
      { name: 'New Orleans', base: 1200, seed: 29 },
      { name: 'Austin', base: 1300, seed: 35 },
      { name: 'Baltimore', base: 1050, seed: 41 },
      { name: 'Cleveland', base: 1000, seed: 47 },
      { name: 'Denver', base: 1350, seed: 53 },
      { name: 'Detroit', base: 1000, seed: 59 },
      { name: 'Kansas City', base: 650, seed: 65 },
      { name: 'Los Angeles', base: 3800, seed: 71 },
      { name: 'Minneapolis', base: 1300, seed: 77 },
      { name: 'Nashville', base: 1100, seed: 83 },
      { name: 'New York', base: 3900, seed: 89 },
      { name: 'Pittsburgh', base: 600, seed: 95 },
      { name: 'Portland', base: 1350, seed: 101 },
      { name: 'Providence', base: 800, seed: 107 },
      { name: 'Richmond', base: 550, seed: 113 },
      { name: 'St. Louis', base: 750, seed: 119 },
      { name: 'San Francisco', base: 2500, seed: 125 },
      { name: 'Santa Fe', base: 300, seed: 131 },
      { name: 'Seattle', base: 1500, seed: 137 },
      { name: 'Washington DC', base: 2200, seed: 143 }
    ];
    var palette = ['#1d3a5f', '#4cc3f5', '#ef5a6f', '#f5aa2e', '#9a4392', '#0f8a6c', '#f27ad8', '#8a929b'];
    var MAX = 8;
    var byName = {};
    catalog.forEach(function (c) { byName[c.name] = c; });
    var swatchOf = function (color) { return 'width: 14px; height: 3px; border-radius: 2px; background: ' + color; };
    var series = st.picked.map(function (nm, i) {
      var m = byName[nm];
      return { name: m.name, color: palette[i], d: self.line(m.seed, m.base, n), swatch: swatchOf(palette[i]) };
    });
    var q = (st.dmaQuery || '').toLowerCase().trim();
    var draftFull = st.draft.length >= MAX;
    var chosen = st.draft.map(function (nm) { return byName[nm]; });
    var rest = catalog.filter(function (c) { return st.draft.indexOf(c.name) === -1; });
    var dmaRows = chosen.concat(rest).filter(function (c) { return !q || c.name.toLowerCase().indexOf(q) !== -1; }).map(function (c) {
      var idx = st.draft.indexOf(c.name);
      var on = idx !== -1;
      var off = !on && draftFull;
      return {
        name: c.name, checked: on, disabled: off,
        swatch: on ? swatchOf(palette[idx]) + '; flex: none' : 'display: none',
        rowStyle: 'display: flex; align-items: center; gap: 10px; height: 36px; flex: none; padding: 0; border-radius: 6px; font-size: 13px; ' +
          (off ? 'color: #8A8D90; cursor: not-allowed' : 'color: #242526; cursor: pointer'),
        toggle: function () {
          self.setState(function (prev) {
            var d = prev.draft.slice();
            var at = d.indexOf(c.name);
            if (at !== -1) d.splice(at, 1); else if (d.length < MAX) d.push(c.name);
            return { draft: d };
          });
        }
      };
    });
    var months = [['Oct', 0], ['Nov', 31], ['Dec', 61], ['Jan', 92], ['Feb', 123], ['Mar', 151], ['Apr', 182], ['May', 212], ['Jun', 243], ['Jul', 273], ['Aug', 304], ['Sep', 335]].map(function (m) {
      return { label: m[0], x: (64 + m[1] * (1120 / (n - 1))).toFixed(1) };
    });
    var shown = st.shown && ready;
    return Object.assign(fields, {
      hasCov: st.cov !== null,
      canAddCovariate: st.cov === null,
      addCovariate: function () { self.setState({ cov: '' }); },
      generateDisabled: !canGenerate,
      generate: function () { if (canGenerate) self.setState({ shown: true, stale: false }); },
      generateStyle: 'display: flex; align-items: center; height: 32px; box-sizing: border-box; padding: 0 20px; font-size: 13px; font-weight: 600; border-radius: 6px; ' +
        (canGenerate ? 'color: #00618B; background: #ffffff; border: 1px solid #00618B; cursor: pointer' : 'color: #686A6C; background: #F1F5FA; border: 1px solid #E4E8ED; cursor: not-allowed'),
      clearAll: function () { self.setState({ y: '', loc: '', date: '', cov: null, shown: false }); },
      shown: shown,
      empty: !shown,
      series: series,
      months: months,
      shownCount: st.picked.length,
      pickerOpen: st.pickerOpen && shown,
      pickerOpenStr: st.pickerOpen ? 'true' : 'false',
      togglePicker: function () { self.setState({ pickerOpen: !st.pickerOpen, draft: st.picked, dmaQuery: '' }); },
      pickerBtnStyle: 'display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 16px; font-size: 13px; font-weight: 600; color: #00618B; border: 1px solid transparent; border-radius: 6px; cursor: pointer; background: ' + (st.pickerOpen ? '#E6F0F6' : 'transparent'),
      draftCount: st.draft.length,
      dmaQuery: st.dmaQuery,
      onDmaSearch: function (e) { self.setState({ dmaQuery: e.target.value }); },
      selRows: dmaRows.filter(function (d) { return d.checked; }),
      restRows: dmaRows.filter(function (d) { return !d.checked; }),
      clearDraft: function () { self.setState({ draft: [] }); },
      cancelPicker: function () { self.setState({ pickerOpen: false, draft: st.picked, dmaQuery: '' }); },
      applyPicker: function () { self.setState({ pickerOpen: false, picked: st.draft, dmaQuery: '' }); }
    });
  }
}
</script>
</body>
