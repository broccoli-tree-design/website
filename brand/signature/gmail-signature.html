<!doctype html>
<html>
<head><meta charset="utf-8"><title>Gmail signature</title></head>
<body style="margin:24px;background:#ffffff;">
<!--
  Open this file in a browser, select the card below, copy it, and paste it into
  Gmail > Settings > See all settings > Signature.

  Colours are brand/tokens.json's dark theme, written inline because email
  clients ignore stylesheets:
    card         green-800   #0e372d  (bg)
    name         neutral-100 #f6f5e5  (ink)
    title        green-300   #a8cf8a  (accent)
    link         neutral-200 #d7dccb  (muted)
    bar          orange-400  #fb7e4f  (warm)
  After a palette change, update the hexes here by hand.

  The photo and its growth rings are one transparent PNG, public/signature-photo.png,
  served from the live site so Gmail can load it. It runs off the card's right edge
  like the hero, so the card's radius (14px) must match the image's right corners.
-->
<table cellpadding="0" cellspacing="0" border="0" bgcolor="#0e372d" style="border-collapse:separate;background:#0e372d;border-radius:14px;font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td valign="middle" style="padding:0 6px 0 32px;">
      <div style="font-family:Georgia,'Times New Roman',serif;font-size:28px;line-height:30px;font-weight:bold;letter-spacing:-0.6px;color:#f6f5e5;">Aiqi Li</div>
      <div style="font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:16px;line-height:24px;color:#a8cf8a;padding-top:3px;">UX Designer for Legal Tech</div>
      <div style="width:28px;height:3px;line-height:3px;font-size:1px;background:#fb7e4f;margin:12px 0 11px;">&nbsp;</div>
      <div><a href="https://www.broccolitree.design" style="font-size:13px;line-height:18px;letter-spacing:0.2px;color:#d7dccb;text-decoration:underline;">BroccoliTree.Design</a></div>
    </td>
    <td valign="top" style="padding:0;width:150px;">
      <img src="https://www.broccolitree.design/signature-photo.png" width="150" height="150" alt="Aiqi Li" style="display:block;width:150px;height:150px;border:0;">
    </td>
  </tr>
</table>
</body>
</html>
